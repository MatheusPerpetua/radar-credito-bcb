name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ci-parse-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dbt]"
      - working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .
